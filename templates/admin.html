<!DOCTYPE html>
<html>

<head>

    <title>Staff Login - Campus Lost & Found</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <header>

        <nav>

            <div class="logo">
                Campus Lost & Found
            </div>

            <ul class="nav-links">

                <li>
                    <a href="{{ url_for('home') }}">
                        Home
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('browse') }}">
                        Browse Items
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <h1>
        Staff Login
    </h1>

    <p style="text-align: center;">
        Authorized staff can manage Lost & Found reports.
    </p>


    <div class="search-box">

        <form onsubmit="adminLogin(event)">

            <label>
                Username
            </label>

            <input
                type="text"
                id="adminUsername"
                placeholder="Enter username"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>

    </div>


    <a href="{{ url_for('home') }}" class="back-link">
        ← Back to Home
    </a>


    <footer>

        <p>
            Campus Lost & Found
        </p>

    </footer>


    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>

</body>

</html>
