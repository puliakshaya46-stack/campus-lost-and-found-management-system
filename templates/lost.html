<!DOCTYPE html>
<html>

<head>

    <title>Report Lost Item</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <header>

        <nav>

            <div class="logo">
                Campus Lost & Found
            </div>

            <ul class="nav-links">

                <li>
                    <a href="{{ url_for('home') }}">
                        Home
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('lost') }}">
                        Report Lost
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('found') }}">
                        Report Found
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('browse') }}">
                        Browse Items
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('admin') }}">
                        Staff Login
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <h1>
        Report Lost Item
    </h1>

    <p style="text-align: center;">
        Enter the details of the item you lost.
    </p>


    <form>

        <label>
            Student Name
        </label>

        <input
            type="text"
            name="studentName"
            placeholder="Enter your name"
            required
        >


        <label>
            Item Name
        </label>

        <input
            type="text"
            name="itemName"
            placeholder="Example: Black Wallet"
            required
        >


        <label>
            Category
        </label>

        <select name="category" required>

            <option value="">
                Select Category
            </option>

            <option value="electronics">
                Electronics
            </option>

            <option value="documents">
                Documents
            </option>

            <option value="clothing">
                Clothing
            </option>

            <option value="books">
                Books
            </option>

            <option value="other">
                Other
            </option>

        </select>


        <label>
            Date Lost
        </label>

        <input
            type="date"
            name="dateLost"
            required
        >


        <label>
            Location Lost
        </label>

        <input
            type="text"
            name="locationLost"
            placeholder="Example: College Library"
            required
        >


        <label>
            Description
        </label>

        <textarea
            name="description"
            rows="5"
            placeholder="Describe the lost item..."
            required
        ></textarea>


        <label>
            Contact Number
        </label>

        <input
            type="tel"
            name="contact"
            placeholder="Enter your contact number"
            required
        >


        <button
            type="button"
            onclick="saveItem('lost')"
        >
            Submit Report
        </button>

    </form>


    <a href="{{ url_for('home') }}" class="back-link">
        ← Back to Home
    </a>


    <footer>

        <p>
            Campus Lost & Found
        </p>

    </footer>


    <script src="{{ url_for('static', filename='js/form.js') }}"></script>

</body>

</html>
