<!DOCTYPE html>
<html>

<head>

    <title>Browse Lost & Found Items</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <header>

        <nav>

            <div class="logo">
                Campus Lost & Found
            </div>

            <ul class="nav-links">

                <li>
                    <a href="{{ url_for('home') }}">
                        Home
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('lost') }}">
                        Report Lost
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('found') }}">
                        Report Found
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('browse') }}">
                        Browse Items
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('admin') }}">
                        Staff Login
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <h1>
        Browse Lost & Found Items
    </h1>

    <p style="text-align: center;">
        Search approved items reported on campus.
    </p>


    <!-- Search -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search item name..."
        >


        <select id="categorySelect">

            <option value="">
                All Categories
            </option>

            <option value="electronics">
                Electronics
            </option>

            <option value="documents">
                Documents
            </option>

            <option value="clothing">
                Clothing
            </option>

            <option value="books">
                Books
            </option>

            <option value="other">
                Other
            </option>

        </select>


        <button onclick="searchItems()">
            Search
        </button>

    </div>


    <!-- Lost Items -->

    <div class="item-container">

        <h2>
            Lost Items
        </h2>

        <div id="lost-items">
        </div>


        <!-- Found Items -->

        <h2>
            Found Items
        </h2>

        <div id="found-items">
        </div>

    </div>


    <a href="{{ url_for('home') }}" class="back-link">
        ← Back to Home
    </a>


    <footer>

        <p>
            Campus Lost & Found
        </p>

    </footer>


    <script src="{{ url_for('static', filename='js/browse.js') }}"></script>

</body>

</html>
