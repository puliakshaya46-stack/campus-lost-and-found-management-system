<!DOCTYPE html>
<html>

<head>

    <title>Staff Dashboard - Campus Lost & Found</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- Header -->

    <header>

        <nav>

            <div class="logo">
                Campus Lost & Found
            </div>

            <ul class="nav-links">

                <li>
                    <a href="{{ url_for('home') }}">
                        Home
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('browse') }}">
                        Browse Items
                    </a>
                </li>

                <li>
                    <a href="#" onclick="logout()">
                        Logout
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- Dashboard -->

    <section class="dashboard">

        <h1>
            Staff Dashboard
        </h1>

        <p style="text-align: center;">
            Manage campus Lost & Found reports.
        </p>


        <!-- Statistics -->

        <div class="dashboard-stats">

            <div class="stat-card">

                <h3>
                    Total Items
                </h3>

                <p id="total-items">
                    0
                </p>

            </div>


            <div class="stat-card">

                <h3>
                    Pending
                </h3>

                <p id="pending-count">
                    0
                </p>

            </div>


            <div class="stat-card">

                <h3>
                    Approved
                </h3>

                <p id="approved-count">
                    0
                </p>

            </div>


            <div class="stat-card">

                <h3>
                    Claimed
                </h3>

                <p id="claimed-count">
                    0
                </p>

            </div>

        </div>


        <!-- Reports -->

        <h2>
            Reported Items
        </h2>


        <div id="dashboard-items">
        </div>

    </section>


    <!-- Footer -->

    <footer>

        <p>
            Campus Lost & Found
        </p>

    </footer>


    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

</body>

</html>
